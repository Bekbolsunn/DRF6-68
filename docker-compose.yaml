services:
  web:
    build:
      context: .
    container_name: shop_web
    command: sh -c "python manage.py makemigrations && python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    ports:
      - "7001:8000"
    env_file: .env
    volumes:
      - .:/app
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:14
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    container_name: shop_db
    volumes:
      - db-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: shop_redis
    volumes:
      - redis-data:/data

  celery_worker:
    build:
      context: .
    container_name: shop_worker
    command: celery -A shop_api worker --loglevel=INFO
    env_file: .env
    depends_on: 
      - redis
    volumes:
      - .:/app

  celery_beat:
    build:
      context: .
    container_name: shop_beat
    command: celery -A shop_api beat --loglevel=INFO
    env_file: .env
    depends_on: 
      - redis
    volumes:
      - .:/app

  celery_flower:
    build:
      context: .
    container_name: shop_flower
    command: celery -A shop_api flower --port=5555
    ports:
    - "5555:5555"
    env_file: .env
    depends_on: 
      - redis
    volumes:
      - .:/app
    
volumes:
  db-data:
  redis-data:
